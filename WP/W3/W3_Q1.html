<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Student Bio-Data</title>
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 shadow-sm rounded">
        <h2 class="text-center mb-4">Student Bio-Data Form</h2>
        <table class="table table-borderless">
            <tr>
                <td><label class="form-label">Full Name:</label></td>
                <td><input type="text" class="form-control" placeholder="Enter Name"></td>
            </tr>
            <tr>
                <td><label class="form-label">Gender:</label></td>
                <td>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="m">
                        <label class="form-check-label" for="m">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="f">
                        <label class="form-check-label" for="f">Female</label>
                    </div>
                </td>
            </tr>
            <tr>
                <td><label class="form-label">Hobbies:</label></td>
                <td>
                    <input type="checkbox" class="form-check-input"> Reading
                    <input type="checkbox" class="form-check-input ms-2"> Coding
                </td>
            </tr>
            <tr>
                <td colspan="2" class="text-center">
                    <button type="submit" class="btn btn-primary px-5">Submit Bio-Data</button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
