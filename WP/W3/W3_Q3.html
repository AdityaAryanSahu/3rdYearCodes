<div class="container border mt-4">
    <div class="row bg-primary text-white p-4 mb-2 text-center">
        <div class="col-12">
            <h4>Top Section: Welcome Dashboard <span class="badge bg-warning text-dark">New</span></h4>
            <div class="input-group mt-3 w-50 mx-auto">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" placeholder="Username">
            </div>
        </div>
    </div>

    <div class="row text-center p-3">
        <div class="col-md-4 border p-3">
            <h6>Action Center</h6>
            <div class="btn-group-vertical">
                <button class="btn btn-outline-primary">Update Profile</button>
                <button class="btn btn-outline-primary">View Settings</button>
            </div>
        </div>
        <div class="col-md-4 border p-3 bg-light">
            <h6>Notifications</h6>
            <button class="btn btn-primary position-relative">
                Inbox <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">99+</span>
            </button>
        </div>
        <div class="col-md-4 border p-3">
            <h6>Status Check</h6>
            <input type="text" class="form-control mb-2" placeholder="Search tasks...">
            <span class="badge rounded-pill bg-success">Online</span>
        </div>
    </div>
</div>
